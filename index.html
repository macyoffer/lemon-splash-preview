<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lemon splash preview</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: light-dark(#fffdf8, #1c1610);
      color: light-dark(#1a140e, #f4ead2);
    }
    main {
      display: grid;
      justify-items: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
    }
    p {
      margin: 0;
      max-width: 28rem;
      line-height: 1.4;
      opacity: 0.8;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
<svg id="lemon-splash" width="220" viewBox="0 0 310 330" role="img" aria-labelledby="lemon-title lemon-desc">
  <title id="lemon-title">Lemon splash</title>
  <desc id="lemon-desc">The lemon stays still. Its three juice drops splash outward, then drift back into place.</desc>
  <style>
    #lemon-splash {
      display: block;
      overflow: visible;
    }
    #lemon-splash .juice-top,
    #lemon-splash .juice-mid,
    #lemon-splash .juice-side {
      transform-box: fill-box;
      transform-origin: center;
    }
    #lemon-splash .juice-top { animation: splash-top 2.8s ease-in-out infinite; }
    #lemon-splash .juice-mid { animation: splash-mid 2.8s ease-in-out infinite; }
    #lemon-splash .juice-side { animation: splash-side 2.8s ease-in-out infinite; }
    @keyframes splash-top {
      0%, 12% { transform: translate(0%, 0%) rotate(0deg); }
      38% { transform: translate(16%, -150%) rotate(-18deg); }
      50% { transform: translate(8%, -128%) rotate(-12deg); }
      100% { transform: translate(0%, 0%) rotate(0deg); }
    }
    @keyframes splash-mid {
      0%, 18% { transform: translate(0%, 0%) rotate(0deg); }
      46% { transform: translate(120%, -125%) rotate(14deg); }
      58% { transform: translate(96%, -100%) rotate(8deg); }
      100% { transform: translate(0%, 0%) rotate(0deg); }
    }
    @keyframes splash-side {
      0%, 24% { transform: translate(0%, 0%) rotate(0deg); }
      54% { transform: translate(155%, -48%) rotate(22deg); }
      66% { transform: translate(128%, -28%) rotate(14deg); }
      100% { transform: translate(0%, 0%) rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #lemon-splash .juice-top,
      #lemon-splash .juice-mid,
      #lemon-splash .juice-side { animation: none; }
    }
  </style>
